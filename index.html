<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VisionForge AI - Pro Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Hind Siliguri',sans-serif;background:#0f0f14;color:#fff}.scene-card{background:#1e1e2a;border:1px solid #3a3a4a;border-radius:16px;padding:16px;margin-bottom:16px} textarea{background:#12121a;border:1px solid #444;color:#fff;width:100%;border-radius:12px;padding:12px;min-height:90px}.badge{background:#2a2a3a;padding:4px 10px;border-radius:20px;font-size:12px;display:inline-flex;gap:6px;margin-right:6px}</style>
</head>
<body class="p-4 max-w-2xl mx-auto">
<h1 class="text-2xl font-bold text-center py-4">🎬 VisionForge AI - Pro Studio</h1>
<p class="text-center text-gray-400 text-sm mb-4">২০ মিনিটের গল্প, নাটক, ভিডিও বানাও - বাংলা ভয়েস সহ</p>
<div id="scenes"></div>
<button onclick="addScene()" class="w-full border border-[#7c5cff] text-[#7c5cff] py-3 rounded-xl mb-3 font-semibold">+ নতুন Scene যোগ করো (৫ মিনিট)</button>
<button onclick="renderVideo()" class="w-full bg-[#7c5cff] py-4 rounded-xl font-bold text-lg">🔥 পুরা ভিডিও রেন্ডার ও ডাউনলোড</button>
<div id="output" class="mt-6 hidden">
 <div class="bg-[#1e1e2a] p-4 rounded-xl">
  <h3 class="font-bold mb-2">✅ রেন্ডার প্রোগ্রেস</h3>
  <div id="progress" class="text-sm text-gray-300"></div>
  <canvas id="canvas" width="1280" height="720" class="w-full rounded-xl mt-3 bg-black"></canvas>
  <video id="preview" controls class="w-full rounded-xl mt-3 hidden"></video>
  <button id="dlBtn" class="hidden w-full bg-green-600 py-3 rounded-xl mt-3 font-bold">⬇️ ভিডিও ডাউনলোড করো</button>
 </div>
</div>
<script>
let scenesData=["একটি গ্রামের সকাল, কুয়াশা, পাখির ডাক","নায়ক হাঁটছে, সিনেমাটিক","নায়িকা দেখা, বৃষ্টি পড়ছে","শেষ দৃশ্য, সূর্যাস্ত"];
function renderScenes(){const c=document.getElementById('scenes');c.innerHTML='';scenesData.forEach((t,i)=>{c.innerHTML+=`<div class="scene-card"><div class="flex justify-between"><span class="text-[#7c5cff] font-bold">Scene ${i+1} - 5 মিনিট</span><button onclick="removeScene(${i})" class="text-red-400 text-xs">ডিলিট</button></div><textarea oninput="scenesData[${i}]=this.value" placeholder="এই সিনে কি হবে লিখো...">${t}</textarea><div class="mt-2"><span class="badge">⏱ 5 min</span><span class="badge">🎙 বাংলা Voice</span><span class="badge">🎨 AI Visual</span></div></div>`;});}
function addScene(){scenesData.push("নতুন দৃশ্য - এখানে লিখো");renderScenes();}
function removeScene(i){scenesData.splice(i,1);renderScenes();}
async function renderVideo(){
 if(scenesData.some(s=>!s.trim())){alert("ভাই সব Scene এ কিছু লিখো!");return;}
 document.getElementById('output').classList.remove('hidden');
 const progress=document.getElementById('progress');
 const canvas=document.getElementById('canvas'); const ctx=canvas.getContext('2d');
 const preview=document.getElementById('preview');
 progress.innerHTML="🎙 বাংলা ভয়েস রেডি হচ্ছে...";
 function speak(text){return new Promise(res=>{const u=new SpeechSynthesisUtterance(text);u.lang='bn-BD';u.rate=0.9;u.onend=res;speechSynthesis.speak(u);});}
 const colors=[["#0f172a","#7c5cff"],["#1a2a1a","#22c55e"],["#2a1a1a","#ef4444"],["#1a1a2a","#f59e0b"]];
 let chunks=[]; const stream=canvas.captureStream(30); const recorder=new MediaRecorder(stream,{mimeType:'video/webm'});
 recorder.ondataavailable=e=>chunks.push(e.data);
 recorder.onstop=()=>{const blob=new Blob(chunks,{type:'video/webm'});const url=URL.createObjectURL(blob);preview.src=url;preview.classList.remove('hidden');const dl=document.getElementById('dlBtn');dl.classList.remove('hidden');dl.onclick=()=>{const a=document.createElement('a');a.href=url;a.download=`VisionForge-${Date.now()}.webm`;a.click();};progress.innerHTML="✅ ভাই রেন্ডার শেষ! এখন ডাউনলোড করো আর YouTube এ দাও!";};
 recorder.start();
 for(let i=0;i<scenesData.length;i++){
  progress.innerHTML=`🎬 Scene ${i+1}/${scenesData.length} রেন্ডার হচ্ছে: ${scenesData[i].substring(0,40)}...`;
  const grad=ctx.createLinearGradient(0,0,1280,720); grad.addColorStop(0,colors[i%colors.length][0]); grad.addColorStop(1,colors[i%colors.length][1]); ctx.fillStyle=grad; ctx.fillRect(0,0,1280,720);
  ctx.fillStyle="white"; ctx.font="bold 54px Hind Siliguri"; ctx.textAlign="center"; wrapText(ctx,scenesData[i],640,360,1000,70);
  ctx.font="24px Hind Siliguri"; ctx.fillText(`Scene ${i+1} | VisionForge AI`,640,680);
  const utterPromise=speak(scenesData[i]);
  for(let f=0;f<150;f++){await new Promise(r=>setTimeout(r,33));}
  await utterPromise;
 }
 recorder.stop();
}
function wrapText(ctx,text,x,y,maxWidth,lineHeight){const words=text.split(' ');let line='';let yy=y;for(let n=0;n<words.length;n++){const test=line+words[n]+' ';if(ctx.measureText(test).width>maxWidth&&n>0){ctx.fillText(line,x,yy);line=words[n]+' ';yy+=lineHeight;}else line=test;}ctx.fillText(line,x,yy);}
renderScenes();
</script>
</body>
</html>
