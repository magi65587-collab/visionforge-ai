<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dragon Mother Movie - V4</title>
<style>
body{background:#050005;color:#fff;font-family:Arial;padding:10px;margin:0}
h1{color:#ff3366;text-align:center;text-shadow:0 0 15px #ff3366}
.box{background:#1a0a1a;border:1px solid #ff3366;padding:10px;margin:10px 0;border-radius:12px}
textarea{width:100%;background:#000;color:#fff;border:1px solid #ff3366;border-radius:8px;padding:10px;box-sizing:border-box}
button{width:100%;padding:16px;font-size:18px;font-weight:bold;border:none;border-radius:12px;cursor:pointer;margin-top:10px}
.btn{background:linear-gradient(90deg,#ff3366,#ffcc00);color:#000}
#canvas{width:100%;max-width:720px;border-radius:12px;background:#000;display:block;margin:10px auto;aspect-ratio:9/16;border:2px solid #ff3366}
#status{text-align:center;padding:12px;background:#1a0a1a;border-radius:8px;margin:10px 0;border:1px solid #ff3366}
.dl{background:#00ff88;color:#000;display:none}
</style>
</head>
<body>
<h1>🐉 Dragon Mother - Viral Movie</h1>
<p style="text-align:center;color:#aaa">এই সেই মুভি যে দেখছে সেই কাঁদছে 😭</p>
<canvas id="canvas" width="720" height="1280"></canvas>
<div id="status">✅ রেডি! ড্রাগন মুভি বানাও</div>
<div id="scenes"></div>
<button class="btn" onclick="start()">🔥 ড্রাগন মুভি বানাও - Part 1</button>
<button id="dlBtn" class="dl" onclick="downloadV()">⬇️ ভিডিও ডাউনলোড - TikTok এ দাও</button>
<script>
let scenes=[
{bn:"অন্ধকার রাতে একটা মেয়ে জঙ্গলে একা কাঁদছে, তার কোলে একটা ছোট সাদা ড্রাগনের বাচ্চা", en:"beautiful young woman crying in dark forest at night holding small cute white baby dragon in arms, cinematic, emotional, 8k"},
{bn:"গ্রামের মানুষ তাকে ডাইনি বলছে, মেয়েটা ড্রাগনের বাচ্চাকে বুকে জড়িয়ে ধরে বাঁচানোর চেষ্টা করছে", en:"villagers calling her witch, girl protecting baby dragon hugging to chest, dramatic, village torch light"},
{bn:"মেয়েটা একটা পুরানো কুটিরে ড্রাগনের বাচ্চাকে আদর করছে, মায়ের মতো ভালোবাসা", en:"girl in old cottage loving baby dragon like mother, warm candle light, mother love, highly detailed"},
{bn:"বড় ড্রাগন মা এসেছে, বিশাল সাদা ড্রাগন, মেয়েটাকে বাঁচাতে", en:"giant huge white mother dragon appearing to save girl, epic fantasy, cinematic lighting, highly detailed"},
{bn:"শেষ দৃশ্য - মেয়েটা আর ড্রাগন মা একসাথে, সবাই কাঁদছে, আবেগময় মুহুর্ত", en:"girl and giant mother dragon together emotional ending, sunset, everyone crying, viral tiktok movie style"}
];
let canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),recorder,chunks=[],blob,statusEl=document.getElementById('status');
function renderUI(){
 let h="";
 scenes.forEach((s,i)=>{
  h+=`<div class=box><b>Part ${i+1}</b><textarea rows=2 oninput=scenes[${i}].bn=this.value>${s.bn}</textarea></div>`;
 });
 document.getElementById('scenes').innerHTML=h;
}
renderUI();
function speak(t){return new Promise(r=>{let u=new SpeechSynthesisUtterance(t);u.lang='bn-BD';u.rate=0.85;u.onend=()=>r();speechSynthesis.speak(u);});}
async function loadImg(url){
 return new Promise(res=>{
  let img=new Image(); img.crossOrigin="anonymous";
  let to=setTimeout(()=>res(null),15000);
  img.onload=()=>{clearTimeout(to);res(img);};
  img.onerror=()=>{clearTimeout(to);res(null);};
  img.src=url;
 });
}
async function start(){
 statusEl.innerHTML="🎬 ড্রাগন মুভি শুরু...";
 chunks=[]; let stream=canvas.captureStream(30);
 recorder=new MediaRecorder(stream,{mimeType:'video/webm'});
 recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
 recorder.onstop=()=>{blob=new Blob(chunks,{type:'video/webm'});document.getElementById('dlBtn').style.display='block';statusEl.innerHTML="✅ মুভি রেডি ভাই! ডাউনলোড করে TikTok এ দাও, ভাইরাল হবে! 🐉";};
 recorder.start();
 for(let i=0;i<scenes.length;i++){
  let prompt=encodeURIComponent(scenes[i].en + ", vertical video, tiktok style, fantasy movie");
  let imgUrl=`https://image.pollinations.ai/prompt/${prompt}?width=720&height=1280&nologo=true&model=flux&seed=${Math.floor(Math.random()*100000)}&t=${Date.now()}`;
  statusEl.innerHTML=`🐉 Part ${i+1}/${scenes.length} বানাচ্ছে... একটু ওয়েট করো ভাই`;
  let img=await loadImg(imgUrl);
  if(img){
   for(let f=0;f<100;f++){
    let sc=1+(f/100)*0.2;
    ctx.clearRect(0,0,720,1280);
    ctx.save(); ctx.translate(360,640); ctx.scale(sc,sc); ctx.translate(-360,-640);
    ctx.drawImage(img,0,0,720,1280); ctx.restore();
    ctx.fillStyle="rgba(0,0,0,0.5)"; ctx.fillRect(0,1080,720,200);
    ctx.fillStyle="#fff"; ctx.font="bold 22px Arial";
    let txt=scenes[i].bn;
    if(txt.length>55) txt=txt.substring(0,55)+"...";
    ctx.fillText(txt,15,1160);
    ctx.fillStyle="#ffcc00"; ctx.font="bold 18px Arial";
    ctx.fillText("The Mother Monster - Part "+(i+1),15,1120);
    await new Promise(r=>setTimeout(r,50));
   }
  }
  await speak(scenes[i].bn);
 }
 recorder.stop();
}
function downloadV(){let u=URL.createObjectURL(blob);let a=document.createElement('a');a.href=u;a.download=`dragon-mother-part1-${Date.now()}.webm`;a.click();}
</script>
</body>
</html>
