<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Follow AI Clone - 20 Min Movie</title>
<style>body{background:#000;color:#fff;font-family:Arial;padding:12px;margin:0}h1{color:#00ff88;text-align:center}.box{background:#111;border:1px solid #00ff88;padding:12px;margin:12px 0;border-radius:12px}textarea,input{width:100%;background:#000;color:#fff;border:1px solid #00ff88;border-radius:8px;padding:12px;box-sizing:border-box}button{width:100%;padding:18px;font-size:20px;font-weight:bold;border:none;border-radius:12px;cursor:pointer;margin-top:12px}.btn{background:linear-gradient(90deg,#00ff88,#00ccff);color:#000}#canvas{width:100%;max-width:720px;border-radius:12px;background:#000;display:block;margin:12px auto;aspect-ratio:9/16;border:2px solid #00ff88}#status{text-align:center;padding:14px;background:#111;border-radius:8px;margin:10px 0;font-size:16px;border:1px solid #00ff88}.dl{background:#ffcc00;color:#000;display:none}.progress{width:100%;height:12px;background:#222;border-radius:6px;overflow:hidden;margin-top:10px}.bar{height:100%;background:linear-gradient(90deg,#00ff88,#00ccff);width:0%;transition:width 0.3s}</style></head><body>
<h1>🎬 Follow AI Clone - 20 Min</h1>
<p style="text-align:center;color:#aaa">Follow AI এর মতো, কিন্তু ২০ মিনিটের ফুল মুভি!</p>
<canvas id="canvas" width="720" height="1280"></canvas>
<div id="status">✅ রেডি ভাই! ২০ মিনিটের গল্প লেখো</div>
<div class="progress"><div id="bar" class="bar"></div></div>
<div class="box">🎥 মুভির নাম: <input id="title" value="The Dragon Mother - 20 Min Full Movie"></div>
<div class="box">📝 ২০ মিনিটের গল্প লেখো (প্রতি লাইনে ১টা সিন, ৩০-৪০ লাইন লিখলে ২০ মিনিট হবে):
<textarea id="story" rows="12">গ্রামের একটা সুন্দরী মেয়ে জঙ্গলে একা কাঁদছে, কোলে একটা ছোট সাদা ড্রাগন
গ্রামের মানুষ মশাল নিয়ে এসেছে তাকে মারতে, ডাইনি বলে চিৎকার করছে
মেয়েটা ড্রাগনের বাচ্চাকে বুকে জড়িয়ে ধরে দৌড়াচ্ছে বরফের মধ্যে
একটা পুরানো কুটিরে লুকিয়েছে, বাইরে তুষার ঝড়
মেয়েটা আগুন জ্বালিয়ে ড্রাগনের বাচ্চাকে গরম করছে, মায়ের মতো আদর করছে
ড্রাগনের বাচ্চাটা আস্তে আস্তে বড় হচ্ছে, মেয়েটার সাথে খেলছে
গ্রামের প্রধান ঘোষণা দিচ্ছে, ওই ডাইনিকে ধরতে হবে
মেয়েটা আর ড্রাগন পাহাড়ের উপরে উঠছে, পিছনে গ্রামবাসী
রাতের আকাশে হঠাৎ বিশাল একটা ছায়া, মা ড্রাগন এসেছে
বিশাল সাদা মা ড্রাগন আকাশ থেকে নামছে, বরফ উড়ছে
গ্রামবাসী ভয়ে পালাচ্ছে, মা ড্রাগন গর্জন করছে
মেয়েটা হাসছে, তার ছেলে আজ মায়ের কাছে ফিরেছে
মা ড্রাগন মেয়েটাকে মাথা নিচু করে সম্মান জানাচ্ছে
শেষ দৃশ্য - মেয়ে, ছোট ড্রাগন আর মা ড্রাগন একসাথে পাহাড়ের চূড়ায়, সূর্য উঠছে
</textarea></div>
<div class="box">⏱️ সময়: <select id="timePerScene"><option value="30">30 সেকেন্ড / সিন (১৪ সিন = ৭ মিনিট)</option><option value="45" selected>45 সেকেন্ড / সিন (২৭ সিন = ২০ মিনিট)</option><option value="60">60 সেকেন্ড / সিন (২০ সিন = ২০ মিনিট)</option></select></div>
<button class="btn" onclick="start()">🔥 ২০ মিনিটের মুভি বানাও - Follow AI Style</button>
<button id="dlBtn" class="dl" onclick="downloadV()">⬇️ ২০ মিনিটের ফুল মুভি ডাউনলোড</button>
<script>
let canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),recorder,chunks=[],blob,statusEl=document.getElementById('status'),bar=document.getElementById('bar');
function speak(t){return new Promise(r=>{let u=new SpeechSynthesisUtterance(t);u.lang='bn-BD';u.rate=0.85;u.onend=()=>r();speechSynthesis.speak(u);});}
function loadImg(url){return new Promise(res=>{let img=new Image();img.crossOrigin="anonymous";let to=setTimeout(()=>res(null),20000);img.onload=()=>{clearTimeout(to);res(img);};img.onerror=()=>{clearTimeout(to);res(null);};img.src=url;});}
async function start(){
 let lines=document.getElementById('story').value.trim().split('\n').filter(l=>l.trim()!='');
 let title=document.getElementById('title').value||"20 Min Movie";
 let secPerScene=parseInt(document.getElementById('timePerScene').value);
 let totalMin=Math.round((lines.length*secPerScene)/60);
 statusEl.innerHTML=`🎬 ${lines.length} টা সিন, ${totalMin} মিনিটের মুভি শুরু...`;
 bar.style.width="0%"; chunks=[];
 let stream=canvas.captureStream(30); recorder=new MediaRecorder(stream,{mimeType:'video/webm'});
 recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
 recorder.onstop=()=>{blob=new Blob(chunks,{type:'video/webm'});document.getElementById('dlBtn').style.display='block';statusEl.innerHTML=`✅ ${totalMin} মিনিটের ফুল মুভি রেডি ভাই! ডাউনলোড করো! 🎉`; bar.style.width="100%";};
 recorder.start();
 for(let i=0;i<lines.length;i++){
  let bn=lines[i].trim();
  let progress=Math.round(((i)/lines.length)*100);
  bar.style.width=progress+"%";
  statusEl.innerHTML=`🎬 Part ${i+1}/${lines.length} (${totalMin} মিনিটের মধ্যে) - ${bn.substring(0,35)}...`;
  let en=encodeURIComponent(bn+" cinematic movie, Follow AI style, realistic motion, highly detailed, 8k, emotional, vertical video");
  let imgUrl=`https://image.pollinations.ai/prompt/${en}?width=720&height=1280&nologo=true&model=flux&seed=${Math.floor(Math.random()*99999)}&t=${Date.now()}`;
  let img=await loadImg(imgUrl);
  if(img){
   let frames=secPerScene*18;
   for(let f=0;f<frames;f++){
    let sc=1+(f/frames)*0.3;
    let shake=(Math.random()-0.5)*2;
    ctx.clearRect(0,0,720,1280);
    ctx.save(); ctx.translate(360+shake,640); ctx.scale(sc,sc); ctx.translate(-360,-640);
    ctx.drawImage(img,0,0,720,1280); ctx.restore();
    ctx.fillStyle="rgba(0,0,0,0.6)"; ctx.fillRect(0,1040,720,240);
    ctx.fillStyle="#00ff88"; ctx.font="bold 18px Arial"; ctx.fillText(title,15,1070);
    ctx.fillStyle="#fff"; ctx.font="bold 20px Arial";
    let txt=bn; if(txt.length>55) txt=txt.substring(0,55)+"..."; ctx.fillText(txt,15,1105);
    ctx.fillStyle="#ffcc00"; ctx.font="14px Arial"; ctx.fillText(`Part ${i+1}/${lines.length} | ${totalMin} Min Movie | Follow AI Clone`,15,1135);
    ctx.fillStyle="#00ff88"; ctx.fillRect(15,1150, (f/frames)*690, 4);
    await new Promise(r=>setTimeout(r,55));
   }
  }
  await speak(bn);
 }
 recorder.stop();
}
function downloadV(){let u=URL.createObjectURL(blob);let a=document.createElement('a');a.href=u;a.download=`20min-movie-${Date.now()}.webm`;a.click();}
</script></body></html>
