<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VisionForge AI - V2 MOVIE</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:sans-serif;padding:10px}
h1{color:#ff00ff;text-align:center}
.box{background:#1a1a1a;border:1px solid #333;padding:10px;margin:10px 0;border-radius:10px}
textarea{width:100%;background:#000;color:#fff;border:1px solid #555;border-radius:8px;padding:10px}
button{width:100%;padding:15px;font-size:18px;font-weight:bold;border-radius:10px;border:none;margin-top:10px}
.btn{background:linear-gradient(90deg,#ff00ff,#ff6600);color:#fff}
#canvas{width:100%;border-radius:10px;background:#000}
.dl{background:#00ff88;color:#000;display:none}
</style>
</head>
<body>
<h1>🎬 VisionForge V2 MOVIE</h1>
<p style="text-align:center;color:#aaa">মানুষ সহ রিয়েল মুভি বানবে</p>
<canvas id="canvas" width="1280" height="720"></canvas>
<div id="status" style="text-align:center;padding:10px;background:#111;border-radius:8px;margin:10px 0">৪টা Scene রেডি আছে</div>
<div id="scenes"></div>
<button class="btn" onclick="startMovieRender()">🔥 মুভি বানাও</button>
<button id="dlBtn" class="dl" onclick="downloadVideo()">⬇️ ভিডিও ডাউনলোড করো</button>
<script>
let scenesData=[
"ভোরের কুয়াশা ভেদ করে গ্রামের মেঠো পথে রহিম হাটছে, 25 বছরের বাংলাদেশি যুবক, নীল পাঞ্জাবি পরা, realistic, cinematic",
"বটতলায় নদীর ঘাটে আয়েশা দাড়িয়ে, 20 বছরের সুন্দরী বাংলাদেশি মেয়ে, নীল শাড়ি পরা, কলসি হাতে, village background, realistic",
"বৃষ্টির মধ্যে রহিম ও আয়েশা কথা বলছে, আবেগময় মুহুর্ত, গ্রামের বৃষ্টি, cinematic",
"সূর্যাস্তে দুজন নৌকায় বসে আছে, লাল আকাশ, romantic movie ending, highly detailed"
];
let canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),recorder,chunks=[],blob, statusEl=document.getElementById('status');
function renderUI(){let h="";scenesData.forEach((t,i)=>{h+=`<div class=box><b>Scene ${i+1}</b> <span style=color:red;float:right onclick=scenesData.splice(${i},1);renderUI()>ডিলিট</span><textarea rows=3 oninput=scenesData[${i}]=this.value>${t}</textarea></div>`});document.getElementById('scenes').innerHTML=h}
renderUI();
function speak(t){return new Promise(r=>{let u=new SpeechSynthesisUtterance(t);u.lang='bn-BD';u.rate=0.9;u.onend=()=>r();speechSynthesis.speak(u)})}
async function startMovieRender(){
chunks=[];let stream=canvas.captureStream(30);recorder=new MediaRecorder(stream,{mimeType:'video/webm'});recorder.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};recorder.onstop=()=>{blob=new Blob(chunks,{type:'video/webm'});document.getElementById('dlBtn').style.display='block';statusEl.innerHTML="✅ মুভি রেডি! ডাউনলোড করো ভাই"};recorder.start();
for(let i=0;i<scenesData.length;i++){
let p=encodeURIComponent(scenesData[i]+", cinematic movie scene, ultra realistic, 8k, Bangladesh village");
let url=`https://image.pollinations.ai/prompt/${p}?width=1280&height=720&nologo=true&seed=${Date.now()+i}`;
statusEl.innerHTML=`🎬 Scene ${i+1}/${scenesData.length} এর ছবি বানাচ্ছে...`;let img=new Image();img.crossOrigin="anonymous";await new Promise(res=>{img.onload=res;img.onerror=res;img.src=url});
for(let f=0;f<150;f++){let s=1+(f/150)*0.3;ctx.clearRect(0,0,1280,720);ctx.save();ctx.translate(640,360);ctx.scale(s,s);ctx.translate(-640,-360);ctx.drawImage(img,0,0,1280,720);ctx.restore();ctx.fillStyle="rgba(0,0,0,0.4)";ctx.fillRect(0,600,1280,120);ctx.fillStyle="#fff";ctx.font="bold 26px sans-serif";ctx.fillText(scenesData[i].substring(0,55),20,680);await new Promise(r=>setTimeout(r,35))}
await speak(scenesData[i]);
}
recorder.stop();
}
function downloadVideo(){let u=URL.createObjectURL(blob);let a=document.createElement('a');a.href=u;a.download=`movie-${Date.now()}.webm`;a.click()}
</script>
</body>
</html>
